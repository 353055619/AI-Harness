<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生态运营管理 · 交互原型（godw-design 2a）</title>
<style>
:root{--bd:#d4d4d8;--fg:#18181b;--mut:#71717a;--bg:#f4f4f5;--card:#fff;--blue:#2563eb;--orange:#d97706;--green:#16a34a;--dgreen:#15803d;--red:#dc2626;--purple:#7c3aed;--gray:#71717a}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg)}
header{background:#fff;border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:15px}
.pill{border:1px solid var(--bd);border-radius:14px;padding:2px 10px;font-size:12px;background:#fff}
.layout{display:flex;min-height:calc(100vh - 49px)}
nav{width:220px;background:#fff;border-right:1px solid var(--bd);padding:10px 0;flex-shrink:0}
nav .lv1{font-weight:600;padding:8px 14px 2px}
nav a{display:flex;justify-content:space-between;text-decoration:none;color:var(--fg);padding:5px 14px 5px 26px}
nav a:hover{background:var(--bg)}
nav a.on{background:#eef2ff;color:var(--blue)}
nav a.sub{padding-left:38px;color:#3f3f46}
.cnt{background:var(--red);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;min-width:16px;text-align:center;display:inline-block}
main{flex:1;padding:16px 20px;max-width:1080px}
h2{margin:0 0 4px;font-size:18px}h3{margin:18px 0 8px;font-size:15px}
.crumb{color:var(--mut);font-size:12px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{border:1px solid var(--bd);padding:6px 9px;text-align:left;font-size:13px;vertical-align:top}
th{background:#fafafa;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.f label{font-size:12px;color:var(--mut)}
input,select,textarea{padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:#fff;min-width:0}
button{padding:6px 14px;border:1px solid var(--bd);border-radius:6px;background:#fff;cursor:pointer;font:inherit}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
button.dgr{background:#fff;border-color:var(--red);color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
.b{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;color:#fff;white-space:nowrap}
.b.gray{background:var(--gray)}.b.blue{background:var(--blue)}.b.orange{background:var(--orange)}.b.green{background:var(--green)}.b.dgreen{background:var(--dgreen)}.b.red{background:var(--red)}.b.purple{background:var(--purple)}
.mut{color:var(--mut);font-size:12px}
.ok{color:var(--dgreen)}.err{color:var(--red)}
.msg{border-radius:6px;padding:8px 12px;margin:10px 0}
.msg.errm{background:#fef2f2;border:1px solid #fecaca;color:var(--red)}
.msg.okm{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--dgreen)}
.msg.infom{background:#eff6ff;border:1px solid #bfdbfe;color:var(--blue)}
.tl{list-style:none;margin:0;padding:0}
.tl li{border-left:2px solid var(--bd);margin-left:6px;padding:2px 0 8px 12px;position:relative}
.tl li::before{content:"";position:absolute;left:-5px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--bd)}
.tl li.bad::before{background:var(--red)}
.tl li.bad{color:var(--red)}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--bd);border-radius:8px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border-radius:14px;padding:3px 12px;font-size:12px}
.tabs button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.hint{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;font-size:12px;margin:10px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:13px}
.kv div:nth-child(odd){color:var(--mut)}
@media(max-width:760px){nav{width:100%;border-right:none;border-bottom:1px solid var(--bd)}.layout{flex-direction:column}.kv{grid-template-columns:110px 1fr}}
@media(prefers-reduced-motion:no-preference){a,button{transition:background .15s}}
</style>
</head>

function pad3(n){ n=Number(n); return n<10?'00'+n:(n<100?'0'+n:''+n); }
function now(){ return fmt(new Date()); }
function fmt(d){ var p=function(n){return (n<10?'0':'')+n}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============ DB ============ */
var DB;
function loadDB(){ var raw = localStorage.getItem('eco-ops-proto-v1'); if(raw){ try{ DB = JSON.parse(raw); return; }catch(e){} } DB = seedDB(); saveDB(); }
function saveDB(){ localStorage.setItem('eco-ops-proto-v1', JSON.stringify(DB)); }
function resetDB(){ if(confirm('恢复初始演示数据？当前操作将清空。')){ DB = seedDB(); saveDB(); location.hash = '#/todo'; render(); } }
function me(){ return DB.users[DB.session]; }
function uname(id){ return DB.users[id] ? DB.users[id].name : (id||'—'); }
function toast(msg, bad){ var t = document.getElementById('toast'); if(!t){ t = document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:99'; document.body.appendChild(t); }
 t.innerHTML = '<div class="msg '+(bad?'errm':'okm')+'">'+msg+'</div>'; clearTimeout(t._h); t._h = setTimeout(function(){ t.innerHTML=''; }, 4200); }
function isRole(r){ return me().role === r; }
function isExt(){ return !!me().external; }

/* ============ 业务查询 ============ */
function cp(id){ return DB.coop.find(function(x){return x.id===id}); }
function inc(id){ return DB.inc.find(function(x){return x.id===id}); }
function pay(id){ return DB.pay.find(function(x){return x.id===id}); }
function his(ref){ return DB.his.filter(function(h){return h.ref===ref}); }
function accs(ref){ return DB.acc.filter(function(a){return a.refDoc===ref}); }
function wfs(doc, partner){ return DB.wf.filter(function(w){return w.refDoc===doc && (!partner || w.partner===partner)}); }
function payToward(doc){ return DB.pay.filter(function(p){return p.fromId===doc}); }
function inPay(doc){ return payToward(doc).filter(function(p){return ['待接收','评审中','待授权签核'].indexOf(p.status)>=0}); }
function partnerQuota(c, p){ return p.type==='组织' ? (p.contract ? Number(p.contract.amount||0) : 0) : Number(p.quota||0); }
function usedQuota(doc, partner){ return wfs(doc, partner).filter(function(w){return w.state==='已生成'}).reduce(function(s,w){return s+Number(w.amount)},0); }
function autoFinishCheck(c){
 if(c.status!=='验收中') return;
 var done = c.partners.every(function(p){ return usedQuota(c.id,p.name) >= partnerQuota(c,p) && partnerQuota(c,p)>0; });
 if(done && inPay(c.id).length===0){ c.status='已完结'; addHis(c.id,'项目完结','系统','额度核销完毕·自动完结','累计核销=额度上限'); }
}
function wlHit(type, ident){ return DB.wt.find(function(w){return w.state==='生效' && w.type===type && w.ident===ident}); }
function addHis(ref,env,user,act,concl,bad){ DB.his.push({id:'H-'+(DB.seq.H++),ref:ref,env:env,user:user,act:act,concl:concl||'',time:now(),bad:!!bad}); }
function notify(to,type,title,ref){ DB.ntf.push({id:'N-'+(DB.seq.N++),to:to,type:type,title:title,ref:ref,read:false,time:now()}); }

/* 待办（按角色推导） */
function todos(){
 var u = DB.session, r = me().role, out = [];
 if(r==='业务接口人'){
  DB.coop.forEach(function(c){ if(c.creator===u){ if(c.status==='合同待补') out.push({ref:c.id,env:'合同',title:c.name+' 待提交合同信息（组织级合作方）',st:c.status});
   var ret = payToward(c.id).filter(function(p){return p.status==='已退回'&&!payToward(c.id).some(function(q){return q.prevId===p.id})}); if(ret.length && c.status!=='已驳回') out.push({ref:c.id,env:'付款',title:c.name+' 存在退回支付单，可重新发起付款',st:'已退回'}); } });
 }
 if(r==='审批人'){
  DB.coop.forEach(function(c){ if(c.status==='审批中'&&c.approver===u) out.push({ref:c.id,env:'审批',title:c.name+' 待审批（依据评审结论）',st:c.status}); });
  DB.inc.forEach(function(i){ if(i.status==='待审批'&&!i.withdrawn&&i.approver===u) out.push({ref:i.id,env:'审批',title:i.task+' 社区激励待审批',st:i.status});
   if(i.status==='验收中'&&i.approver===u&&mergeReady(i)) out.push({ref:i.id,env:'合并付款',title:i.task+' 验收已完结，可合并发起付款',st:i.status}); });
  DB.wlc.forEach(function(w){ if(w.status==='待审批'&&w.approver===u) out.push({ref:w.id,env:'白名单审批',title:'白名单变更单 '+w.kind+' 待审批',st:w.status}); });
 }
 if(r==='评审人'){
  DB.coop.forEach(function(c){ if(c.status==='评审中'&&c.reviewer===u) out.push({ref:c.id,env:'评审',title:c.name+' 待评审',st:c.status}); });
  DB.pay.forEach(function(p){ if((p.status==='待接收'||p.status==='评审中')&&p.reviewer===u) out.push({ref:p.id,env:p.status==='待接收'?'接收':'评审',title:p.id+' 支付单（'+p.payee+'）待'+(p.status==='待接收'?'接收确认':'评审'),st:p.status}); });
 }
 if(r==='验收人'){
  DB.coop.forEach(function(c){ if(c.status==='验收中'&&c.acceptor===u) out.push({ref:c.id,env:'验收',title:c.name+' 可验收（支持多次）',st:c.status}); });
  DB.inc.forEach(function(i){ if(i.status==='验收中'&&!i.withdrawn&&i.acceptor===u) out.push({ref:i.id,env:'验收',title:i.task+' 可验收（支持多次/完结标记）',st:i.status}); });
 }
 if(r==='授权签核人'){ DB.pay.forEach(function(p){ if(p.status==='待授权签核'&&p.signee===u) out.push({ref:p.id,env:'授权签核',title:p.id+' 支付单（'+p.payee+'）待授权签核',st:p.status}); }); }
 if(r==='社区开发者'){ DB.inc.forEach(function(i){ if(i.dev===u&&i.status==='待审批'&&!i.withdrawn) out.push({ref:i.id,title:i.task+' 审批中',st:i.status}); }); }
 return out;
}
function mergeReady(i){ var a=accs(i.id); return a.some(function(x){return x.fin}) && a.some(function(x){return x.concl==='通过'}); }
function myDone(){ return DB.his.filter(function(h){return h.user===me().name}); }
function myApplied(){
 var u = DB.session, out = [];
 DB.coop.forEach(function(c){ if(c.creator===u) out.push({ref:c.id,title:c.name,st:c.status,kind:'合作立项'}); });
 DB.inc.forEach(function(i){ if(i.dev===u) out.push({ref:i.id,title:i.task,st:i.withdrawn?'已撤回':i.status,kind:'社区激励'}); });
 DB.wlc.forEach(function(w){ if(w.by===u) out.push({ref:w.id,title:'白名单变更单 · '+w.kind,st:w.status,kind:'白名单'}); });
 return out;
}

 }).join('')+'</ul>';

function payRows(list, opts){

 list.map(function(p){
  var ro = (opts||{}).ro || !canActPay(p);
  return '<tr><td>'+p.id+(p.prevId?'<br><span class="mut">重发自 '+p.prevId+'</span>':'')+'</td><td>'+p.fromId+'</td><td>'+esc(p.payee)+'</td><td>'+p.cat+'</td><td>¥'+money(p.amount)+'</td><td>'+badge(p.status==='已发送统一付款平台'?'已发送统一付款平台':p.status)+'</td><td><a href="#/pay-detail/'+p.id+'">'+(ro?'查看':'处理')+'</a></td></tr>';
 }).join('')+'</table>';
}
function canActPay(p){
 var r = me().role, u = DB.session;
 if(r==='评审人'&&(p.status==='待接收'||p.status==='评审中')&&p.reviewer===u) return true;
 if(r==='授权签核人'&&p.status==='待授权签核'&&p.signee===u) return true;
 if(r==='系统管理员'&&['待接收','评审中','待授权签核'].indexOf(p.status)>=0) return true;
 return false;
}

function submitCP(editId){
 var name = document.getElementById('f-name').value.trim();
 var c = { name:name, creator:DB.session, status:'评审中',
  reviewer:val('f-rev'), approver:val('f-app'), acceptor:val('f-acc'), partners:readPartners() };
 var errs = [];
 if(!c.name) errs.push('项目名称必填');
 c.partners.forEach(function(p,i){ if(!p.name||!p.ident||!p.account.name) errs.push('合作方'+(i+1)+'：名称/对象标识/收款户名必填');
  if(p.type==='个人'&&!p.quota) errs.push('合作方'+(i+1)+'（个人）：须录入付款额度（免合同不免额度）'); });
 var mu = guardMutexCP(c); if(mu) errs.push(mu);
 var m = document.getElementById('cp-msg');
 if(errs.length){ m.innerHTML = '<div class="msg errm">'+errs.join('<br>')+'</div>'; return; }
 if(editId){ c.id = editId; var old = cp(editId); Object.assign(old, {name:c.name,reviewer:c.reviewer,approver:c.approver,acceptor:c.acceptor,partners:c.partners,status:'评审中'}); }
 else { c.id = 'CP-'+pad3(DB.seq.CP++); DB.coop.push(c); }
 addHis(c.id,'发起',me().name, editId?'编辑重提·提交':'代填发起并提交','互斥校验通过（GR-01）· 指定 评审='+uname(c.reviewer)+' 审批='+uname(c.approver)+' 验收='+uname(c.acceptor));
 notify(c.reviewer,'待办产生',c.id+' '+c.name+' 待评审',c.id);
 saveDB(); toast('已提交，进入「评审中」（互斥校验通过）'); go('cp-detail',c.id);
}

function doReassign(cid, formId, admin){
 var c = cp(cid), env = val(formId+'-env'), who = val(formId+'-who'), msg = document.getElementById(formId+'-msg');
 var envName = ({reviewer:'评审',approver:'审批',acceptor:'验收'})[env];

 if(!admin && envHadRecord){ msg.innerHTML = '<span class="err">接口人仅可更换「未开始环节」（该环节已有处理记录）。</span>'; return; }
 if(['已完结','已驳回'].indexOf(c.status)>=0){ msg.innerHTML = '<span class="err">终态单据不可改派（D-032 仅限在途环节）。</span>'; return; }
 if(DB.users[who].role !== envRole(env)){ msg.innerHTML = '<span class="err">候选须具备该环节处理角色（'+envRole(env)+'），当前选择：'+uname(who)+'·'+DB.users[who].role+'。</span>'; return; }
 var oldp = c[env];
 if(oldp===who){ msg.innerHTML = '<span class="err">未变更：选择的人员与当前处理人相同。</span>'; return; }
 var cand = {reviewer:c.reviewer,approver:c.approver,acceptor:c.acceptor}; cand[env] = who;
 var mu = guardMutexCP(cand);
 if(mu){ msg.innerHTML = '<span class="err">'+mu+'（未生效，请另选人员）</span>'; return; }
 c[env] = who;
 addHis(cid,envName,me().name, admin?'管理员改派':'接口人更换处理人', uname(oldp)+' → '+uname(who)+'·已重跑互斥校验（GR-01）');
 notify(oldp,'状态变更',cid+' 已改派，您的原待办失效',cid);

 saveDB(); toast('改派成功：'+({reviewer:'评审人',approver:'审批人',acceptor:'验收人'})[env]+' → '+uname(who)); go('cp-detail',cid);

function cpApprove(id, pass){

  else notify(c.acceptor,'待办产生',id+' 已进入验收，可多次验收',id);
 } else {
  c.status = '已驳回'; addHis(id,'审批',me().name,'审批驳回',text,true);

function cpContract(id){

 if(!(p&&p.type==='组织')){ msg.innerHTML = '<span class="err">请选择组织级合作方。</span>'; return; }

 addHis(id,'合同信息提交与金额录改',me().name,'提交合同信息（'+p.name+'）','附件 '+att+'·协议编号 '+no+'·合同规定金额 '+money(amt)+'（锁定）');
 if(c.partners.every(function(x){return x.type!=='组织' || x.contract})){
  c.status = '验收中';
  notify(c.acceptor,'待办产生',id+' 已进入验收，可多次验收',id);

 c.status = '已完结';

function cpPay(id){
 var c = cp(id);
 if(c.status!=='验收中'){ toast('单据状态已变更（当前 '+c.status+'），请刷新后操作', true); return; }
 var pi = Number(val('pf-partner')), p = c.partners[pi], amt = Number(val('pf-amt')), msg = document.getElementById('pf-msg');
 var btn = event ? event.target : null;
 if(btn && btn.disabled) return; // 幂等
 if(btn) btn.disabled = true;
 function done(){ if(btn) btn.disabled = false; }
 var dup = inPay(id).filter(function(x){return x.payee===p.name});
 if(dup.length){ msg.innerHTML = '<span class="err">该合作方已有在途支付单（'+dup.map(function(x){return x.id}).join('、')+'），请等待其终态后再发起。</span>'; done(); return; }
 var a = accs(id);
 if(!a.some(function(x){return x.concl==='通过'})){ msg.innerHTML = '<span class="err">付款前置：须存在≥1条「通过」验收记录（D-014）。</span>'; done(); return; }
 var hit = wlHit(p.type==='组织'?'组织':'开发者', p.ident);
 if(!hit){ msg.innerHTML = '<span class="err">NFR-03 白名单拦截：合作方 '+esc(p.name)+'（'+esc(p.ident)+'）不在生效名单内。可联系管理员导入白名单（指引：系统管理>白名单管理）。</span>'; done(); return; }
 var q = partnerQuota(c,p), used = usedQuota(c.id,p.name), left = q-used;
 if(!(amt>0)){ msg.innerHTML = '<span class="err">请输入有效金额（&gt;0）。</span>'; done(); return; }
 if(amt>left){ msg.innerHTML = '<span class="err">GR-02 额度拦截：本次 ¥'+money(amt)+' 超出剩余额度 ¥'+money(left)+'（合同/额度 ¥'+money(q)+'，已核销 ¥'+money(used)+'），超出 ¥'+money(amt-left)+'。</span>'; done(); return; }
 var rev = DB.pools['支付评审'][0], sig = DB.pools['支付授权签核'][0];
 var ret = DB.pay.filter(function(x){return x.fromId===id&&x.payee===p.name&&x.status==='已退回'&&!DB.pay.some(function(y){return y.prevId===x.id})});
 var prevId = ret.length? ret[ret.length-1].id : '';
 var np = {id:'PAY-'+pad3(DB.seq.PAY++),fromType:'CP',fromId:id,payee:p.name,cat:p.cat,account:JSON.parse(JSON.stringify(p.account)),amount:amt,basis:'验收记录（通过）'+(prevId?'·重发自 '+prevId:''),contractNo:p.contract?p.contract.no:'',reviewer:rev,signee:sig,by:DB.session,status:'待接收',prevId:prevId};
 var g = guardPayPeople(np, DB.session);
 if(g){ msg.innerHTML = '<span class="err">'+g+'（请在权限管理调整人员池）</span>'; done(); return; }
 DB.pay.push(np);
 var bal = left-amt;
 DB.wf.push({id:'WF-'+pad3(DB.wf.length+1),refDoc:id,partner:p.name,amount:amt,payId:np.id,bal:bal,by:DB.session,time:now(),state:'已生成',wlHit:hit.id+' '+hit.name});
 addHis(id,'付款发起',me().name,'发起付款','选定 '+p.name+'·¥'+money(amt)+'·白名单依据 '+hit.id+'·核销后余额 ¥'+money(bal)+(prevId?'·重发自 '+prevId:''));
 notify(rev,'待办产生',np.id+' 支付单（'+p.name+'）待接收确认',np.id);
 autoFinishCheck(c);
 saveDB(); toast('支付单 '+np.id+' 已生成（核销 ¥'+money(amt)+'），进入下游非采对外支付');
 done(); go('cp-detail',id);
}

 function done(){ if(btn) btn.disabled = false; }
 var a = accs(id);
 var ret = DB.pay.filter(function(x){return x.fromId===id&&x.status==='已退回'&&!DB.pay.some(function(y){return y.prevId===x.id})});
 if(mode==='merge'){
  if(i.status!=='验收中'){ msg.innerHTML = '<span class="err">单据状态已变更（当前 '+i.status+'），不能重复发起。</span>'; done(); return; }
  if(!a.some(function(x){return x.fin})){ msg.innerHTML = '<span class="err">合并付款前置：须存在「验收完结」标记（D-013）。</span>'; done(); return; }
 } else {
  if(i.status!=='已完结'){ msg.innerHTML = '<span class="err">仅已完结（付款被退回）可重发。</span>'; done(); return; }
  if(!ret.length){ msg.innerHTML = '<span class="err">无待重发的退回支付单。</span>'; done(); return; }
 }
 if(!a.some(function(x){return x.concl==='通过'})){ msg.innerHTML = '<span class="err">付款前置：≥1条「通过」验收（D-014）。</span>'; done(); return; }
 if(!(amt>0)){ msg.innerHTML = '<span class="err">请输入有效金额（&gt;0）。</span>'; done(); return; }
 if(amt>(i.approved||0)){ msg.innerHTML = '<span class="err">GR-02 额度拦截：合并付款 ≤审批通过金额 ¥'+money(i.approved||0)+'。</span>'; done(); return; }
 var dev = DB.users[i.dev], rev = DB.pools['支付评审'][0], sig = DB.pools['支付授权签核'][0];
 var hit = wlHit('开发者', dev.uid);

 var prevId = mode==='reissue'? ret[ret.length-1].id : '';
 var np = {id:'PAY-'+pad3(DB.seq.PAY++),fromType:'INC',fromId:id,payee:dev.name,cat:'开发者',account:JSON.parse(JSON.stringify(i.account)),amount:amt,basis:'激励合并付款 · 审批通过金额'+(prevId?'·重发自 '+prevId:''),contractNo:'',reviewer:rev,signee:sig,by:DB.session,status:'待接收',prevId:prevId};
 var g = guardPayPeople(np, DB.session);
 if(g){ msg.innerHTML = '<span class="err">'+g+'</span>'; done(); return; }
 DB.pay.push(np);
 DB.wf.push({id:'WF-'+pad3(DB.wf.length+1),refDoc:id,partner:dev.name,amount:amt,payId:np.id,bal:((i.approved||0)-amt),by:DB.session,time:now(),state:'已生成',wlHit:(hit?hit.id+' '+hit.name:'—')});
 if(mode==='merge'){ i.status = '已完结'; }
 addHis(id,'付款发起',me().name, mode==='merge'?'合并发起付款（一次）':'重新合并发起付款（重发）','¥'+money(amt)+'·白名单依据 '+hit.id+'·生成 '+np.id+(prevId?'·重发自 '+prevId:''));
 notify(rev,'待办产生',np.id+' 待接收确认',np.id);
 notify(i.dev,'状态变更',id+' 已提交付款申请（'+np.id+'）',id);
 saveDB(); toast('付款已发起：'+np.id); done(); go('inc-detail',id);
}

 if(p.status!=='评审中'){ toast('单据状态已变更（当前 '+p.status+'），请刷新后操作', true); return; }
 var concl = (document.querySelector('input[name=pv]:checked')||{}).value, t = val('pv-text'), msg = document.getElementById('pv-msg');
 if(concl==='通过'){ p.status='待授权签核'; addHis(id,'评审',me().name,'评审通过',t||'同意'); notify(p.signee,'待办产生',id+' 待授权签核',id); }
 else { if(!t){ msg.innerHTML = '<span class="err">不通过必附原因。</span>'; return; } rejectPay(p, t, '评审'); }
 saveDB(); toast('评审结论已提交：'+concl); go('pay-detail',id);
}
function paySign(id, pass){
 var p = pay(id);
 if(p.status!=='待授权签核'){ toast('单据状态已变更（当前 '+p.status+'），请刷新后操作', true); return; }
 var t = val('psg-text'), msg = document.getElementById('psg-msg');
 if(u_recheck(p)) { msg.innerHTML = '<span class="err">GR-04 拦截：授权签核人与评审人不得为同一人（可能被改派冲突）。</span>'; return; }
 if(pass){
  p.status = '已发送统一付款平台';
  addHis(id,'授权签核',me().name,'授权签核通过','界面呈现「已向统一付款平台提交付款申请」（目标态·本期零对接）');
  if(p.fromType==='CP') autoFinishCheck(cp(p.fromId));
  var up = p.fromType==='CP'? cp(p.fromId).creator : inc(p.fromId).approver;
  var dev = p.fromType==='INC'? inc(p.fromId).dev : null;
  if(up) notify(up,'处理结果',id+' 已向统一付款平台提交付款申请（目标态）',id);
 if(dev) notify(dev,'处理结果',id+' 已向统一付款平台提交付款申请（目标态）',id);
 } else {
  if(!t){ msg.innerHTML = '<span class="err">不通过必附原因。</span>'; return; }
  p.status = '评审中';
  addHis(id,'授权签核',me().name,'授权签核不通过·退回评审','原因：'+t+'（在途·核销不冲回）',true);
  notify(p.reviewer,'待办产生',id+' 授权签核不通过，退回评审',id);
 }
 saveDB(); toast(pass?'授权签核通过，支付单到达终态':'已退回评审'); go('pay-detail',id);
}
function u_recheck(p){ return p.reviewer===p.signee; }
function payReenv(){
 var env = val('pre-env');
 var sel = document.getElementById('pre-who');
 if(sel) sel.innerHTML = env==='reviewer'? rosterOpts('','评审人') : poolOpts('支付授权签核', sel.value);
}
function payReassign(id){
 var p = pay(id), env = val('pre-env'), who = val('pre-who'), msg = document.getElementById('pre-msg');
 if(['待接收','评审中','待授权签核'].indexOf(p.status)<0){ msg.innerHTML = '<span class="err">终态单据不可改派（D-032）。</span>'; return; }
 var oldp = p[env];
 var cand = {reviewer:p.reviewer,signee:p.signee}; cand[env] = who;
 var g = guardPayPeople(cand, p.by);
 if(g){ msg.innerHTML = '<span class="err">'+g+'（未生效，请另选人员）</span>'; return; }
 p[env] = who;
 addHis(id, env==='reviewer'?'评审':'授权签核', me().name, '管理员改派', uname(oldp)+' → '+uname(who)+'·重跑 GR-03/GR-04');
 notify(oldp,'状态变更',id+' 已改派，您的原待办失效',id);
 notify(who,'待办产生',id+' 环节已改派给您',id);
 saveDB(); toast('改派成功'); go('pay-detail',id);
}

function savePools(){
 var next = {}; Object.keys(DB.pools).forEach(function(k){ next[k] = []; });
 document.querySelectorAll('input[data-pool]').forEach(function(cb){ if(cb.checked) next[cb.getAttribute('data-pool')].push(cb.getAttribute('data-user')); });
 var errs = [];
 if(next['激励审批'].length===0||next['激励验收'].length===0||next['支付评审'].length===0||next['支付授权签核'].length===0||next['白名单审批'].length===0) errs.push('各类池不可为空');
 next['激励审批'].forEach(function(u){ if(next['激励验收'].indexOf(u)>=0) errs.push('GR-01：'+uname(u)+' 同时在激励审批池与验收池'); });
 if(errs.length){ document.getElementById('pool-msg').innerHTML = '<span class="err">'+errs.join('；')+'</span>'; return; }
 var warn = [];
 var expect = {'激励审批':'审批人','激励验收':'验收人','支付评审':'评审人','支付授权签核':'授权签核人','白名单审批':'审批人'};
 Object.keys(next).forEach(function(k){ next[k].forEach(function(u){ if(DB.users[u] && DB.users[u].role!==expect[k]) warn.push(uname(u)+'（'+DB.users[u].role+'）与「'+k+'」职能不一致'); }); });
 var ovl = next['支付评审'].filter(function(u){return next['支付授权签核'].indexOf(u)>=0});
 if(ovl.length) warn.push('支付评审池与授权签核池重叠（'+ovl.map(uname).join('、')+'）：GR-04 将在单内绑定校验时拦截，建议分池');
 DB.pools = next;
 addHis('SYS-POOL','配置变更',me().name,'保存人员池','五类池已更新（校验通过）'+(warn.length?'·警告：'+warn.join('；'):''));
 saveDB(); toast('人员池已保存生效'+(warn.length?'（含 '+warn.length+' 条警告，见处理记录）':'')); render();
}
function pWl(){
 var h = crumb('系统管理 > 白名单管理') + '<h2>白名单管理</h2><p class="mut">支付资格硬约束（NFR-03）；匹配键：开发者=统一账号ID / 组织=统一社会信用代码；变更须审批后生效（导入不直接生效）。</p>';
 h += '<div class="card"><h3>名单条目</h3><table><tr><th>编号</th><th>名称</th><th>类型</th><th>对象标识</th><th>状态</th></tr>'
 + DB.wt.map(function(w){ return '<tr><td>'+w.id+'</td><td>'+esc(w.name)+'</td><td>'+w.type+'</td><td class="mut">'+esc(w.ident)+'</td><td>'+badge(w.state)+'</td></tr>'; }).join('')+'</table></div>';
 h += '<div class="card"><h3>Excel 导入（整单校验）/ 手工变更</h3>'
 + '<div class="f"><label>粘贴行（格式：类型,对象标识,名称 —— 类型=开发者/组织；删除行在行尾加第 4 列「删除」；失败行列出原因，全部通过方可提交）</label>'
 + '<textarea id="wl-text" rows="3" style="width:640px" placeholder="开发者,u-wang2,王某&#10;组织,91350000NEW00001X,某机构"></textarea></div>'
 + '<button class="pri" onclick="wlImport()">校验并生成变更单（提交审批）</button><div id="wl-msg"></div></div>';
 h += '<div class="card"><h3>变更单</h3><table><tr><th>单号</th><th>类型</th><th>明细</th><th>提交人</th><th>审批人</th><th>状态</th><th>操作</th></tr>'
 + DB.wlc.slice().reverse().map(function(w){ return '<tr><td>'+w.id+'</td><td>'+w.kind+'</td><td>'+w.lines.map(function(l){return l.op+' '+l.type+' '+esc(l.name)}).join('；')+'</td><td>'+uname(w.by)+'</td><td>'+uname(w.approver)+'</td><td>'+badge(w.status)+'</td><td><a href="#/wlc-detail/'+w.id+'">'+(w.status==='待审批'&&me().role==='审批人'?'审批':'查看')+'</a></td></tr>'; }).join('')+'</table></div>';
 return h;
}
function wlImport(){
 var raw = val('wl-text').trim(), msg = document.getElementById('wl-msg');
 if(!raw){ msg.innerHTML = '<span class="err">请粘贴导入行。</span>'; return; }
 var lines = raw.split('\n').map(function(x){return x.trim()}).filter(Boolean);
 var parsed = [], errs = [];
 lines.forEach(function(ln,i){
  var parts = ln.split(',').map(function(x){return x.trim()});
  if(parts.length<3){ errs.push('第'+(i+1)+'行：列数不足（类型,对象标识,名称）'); return; }
  var type = parts[0], ident = parts[1], name = parts[2];
  if(['开发者','组织'].indexOf(type)<0){ errs.push('第'+(i+1)+'行：类型须为 开发者/组织'); return; }
  if(type==='开发者' && !/^u-/.test(ident)) errs.push('第'+(i+1)+'行：开发者标识须为统一账号ID（u-开头）');
  if(type==='组织' && ident.length<8) errs.push('第'+(i+1)+'行：组织标识须为统一社会信用代码');
  if(DB.wt.some(function(w){return w.ident===ident&&w.state==='生效'}) && !['删除'].includes(parts[3]||'')) errs.push('第'+(i+1)+'行：标识已存在（'+ident+'）');
  parsed.push({op:parts[3]==='删除'?'删除':'新增',type:type,ident:ident,name:name});
 });
 if(errs.length){ msg.innerHTML = '<div class="msg errm">整单校验失败（全部通过方可提交）：<br>'+errs.join('<br>')+'</div>'; return; }
 var w = {id:'WLC-'+pad3(DB.seq.WLC++),kind:'导入',by:DB.session,approver:DB.pools['白名单审批'][0],status:'待审批',time:now(),lines:parsed};
 DB.wlc.push(w);
 addHis(w.id,'发起',me().name,'Excel 导入提交审批','整单校验通过（'+parsed.length+' 行）· 审批人 '+uname(w.approver)+'（≠提交人 GR-03）');
 notify(w.approver,'待办产生',w.id+' 白名单变更单待审批',w.id);
 saveDB(); toast('变更单 '+w.id+' 已生成并提交审批'); go('wlc-detail',w.id);
}
function pWlcDetail(){
 var id = route().id, w = DB.wlc.find(function(x){return x.id===id});
 if(!w) return '<div class="msg errm">未找到 '+esc(id)+'</div>';
 var h = crumb('系统管理 > 白名单管理 > 变更单详情') + '<h2>'+w.id+' '+badge(w.status)+'</h2>';
 h += '<div class="card"><div class="kv"><div>类型</div><div>'+w.kind+'</div><div>提交人</div><div>'+uname(w.by)+'</div><div>审批人</div><div>'+uname(w.approver)+'（白名单审批池·≠提交人 GR-03）</div><div>提交时间</div><div>'+esc(w.time)+'</div></div></div>';
 h += '<div class="card"><h3>变更明细</h3><table><tr><th>操作</th><th>类型</th><th>对象标识</th><th>名称</th></tr>'
 + w.lines.map(function(l){ return '<tr><td>'+l.op+'</td><td>'+l.type+'</td><td class="mut">'+esc(l.ident)+'</td><td>'+esc(l.name)+'</td></tr>'; }).join('')+'</table></div>';
 if(w.status==='待审批' && me().role==='审批人' && DB.session!==w.by){
  h += '<div class="card"><h3>审批</h3><div class="f"><label>审批意见（驳回必附理由）</label><textarea id="wlc-text" rows="2" style="width:520px"></textarea></div>'
  + '<button class="pri" onclick="wlcApprove(\''+id+'\',1)">通过（串行写回生效）</button> <button class="dgr" onclick="wlcApprove(\''+id+'\',0)">驳回</button><div id="wlc-msg"></div></div>';
 } else if(w.status==='待审批'){
  h += '<div class="mut">待 '+uname(w.approver)+' 审批（提交人不可自批，GR-03）。</div>';
 }
 h += '<div class="card"><h3>处理记录</h3>'+tl(id)+'</div>';
 return h;
}
function wlcApprove(id, pass){
 var w = DB.wlc.find(function(x){return x.id===id}), t = val('wlc-text'), msg = document.getElementById('wlc-msg');
 if(!pass && !t){ msg.innerHTML = '<span class="err">驳回必附理由。</span>'; return; }
 if(pass){
  w.lines.forEach(function(l){
   if(l.op==='删除'){ var x = DB.wt.find(function(y){return y.ident===l.ident}); if(x) x.state='失效'; }
   else { var e = DB.wt.find(function(y){return y.ident===l.ident}); if(e) e.state='生效'; else DB.wt.push({id:'WT-'+pad3(DB.seq.WT++),name:l.name,type:l.type,ident:l.ident,state:'生效'}); }
  });
  w.status = '已生效';
  addHis(id,'白名单审批',me().name,'审批通过','串行写回条目并生效（'+w.lines.length+' 行）');
  notify(w.by,'处理结果',id+' 白名单变更单已审批通过并生效',id);
 } else {
  w.status = '已驳回';
  addHis(id,'白名单审批',me().name,'审批驳回',t,true);
  notify(w.by,'处理结果',id+' 白名单变更单被驳回：'+t,id);
 }
 saveDB(); toast(pass?'变更单已生效':'变更单已驳回'); go('wlc-detail',id);
}
